<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scout · Quiet with nav</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1B1F24}a:hover{color:#1F5FCC}
</style>
</helmet>
<div style="width: 400px; height: 880px; box-sizing: border-box; background: #FFFFFF; color: #1B1F24; font-family: 'Figtree', sans-serif; font-size: 14px; line-height: 1.5; display: flex; flex-direction: column">
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 12px 12px 0 16px">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-label="Scout" role="img"><circle cx="12" cy="12" r="9" stroke="#1B1F24" stroke-width="1.8"></circle><circle cx="15" cy="9" r="2.6" fill="#1F5FCC"></circle></svg>
    <button aria-label="Pause Scout" style="width: 36px; height: 36px; border: none; background: transparent; border-radius: 50%; color: #5E6772; display: grid; place-items: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 6v12M15 6v12"></path></svg></button>
  </header>

  <main style="flex: 1; display: flex; flex-direction: column; justify-content: flex-end; padding: 0 16px; gap: 14px">
    <div>
      <div style="font-size: 26px; font-weight: 500; letter-spacing: -0.02em; line-height: 1.2">Worth a look<span style="color: #1F5FCC">.</span></div>
      <div style="color: #5E6772; margin-top: 4px">Three Stripe pages that fit what you were reading.</div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <a href="https://docs.stripe.com/billing/subscriptions/usage-based" style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: #F2F5FA; border-radius: 20px; text-decoration: none">
        <span style="flex: 1; display: flex; flex-direction: column"><span style="font-weight: 600">Usage-based billing</span><span style="font-size: 13px; color: #5E6772">How metered prices roll up into the invoice</span></span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5E6772" stroke-width="1.8"><path d="M7 17L17 7M9 7h8v8"></path></svg>
      </a>
      <a href="https://docs.stripe.com/billing/subscriptions/thresholds" style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: #F2F5FA; border-radius: 20px; text-decoration: none">
        <span style="flex: 1; display: flex; flex-direction: column"><span style="font-weight: 600">Billing thresholds</span><span style="font-size: 13px; color: #5E6772">The setting the issue asks about</span></span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5E6772" stroke-width="1.8"><path d="M7 17L17 7M9 7h8v8"></path></svg>
      </a>
      <a href="https://docs.stripe.com/api/billing/meter" style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: #F2F5FA; border-radius: 20px; text-decoration: none">
        <span style="flex: 1; display: flex; flex-direction: column"><span style="font-weight: 600">The Meter object</span><span style="font-size: 13px; color: #5E6772">Where the issue's error comes from</span></span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5E6772" stroke-width="1.8"><path d="M7 17L17 7M9 7h8v8"></path></svg>
      </a>
    </div>
    <button style="align-self: flex-start; display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border: 1px solid #DCE2EA; background: #FFFFFF; border-radius: 999px; color: #1B1F24; font: 500 13px 'Figtree', sans-serif; cursor: pointer">
      <span style="width: 8px; height: 8px; border-radius: 50%; background: #E8890C"></span>Stripe has 1 file for your agent · Review
    </button>
  </main>

  <div style="margin: 16px 12px 0; border-radius: 24px; background: #F2F5FA; padding: 10px 10px 10px 14px; display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: #3D4550">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 19c-4.3 1.4-4.3-2.5-6-3m12 5v-3.5c0-1 .1-1.4-.5-2 2.8-.3 5.5-1.4 5.5-6a4.6 4.6 0 0 0-1.3-3.2 4.2 4.2 0 0 0-.1-3.2s-1.1-.3-3.5 1.3a12.3 12.3 0 0 0-6.2 0C6.5 2.8 5.4 3.1 5.4 3.1a4.2 4.2 0 0 0-.1 3.2A4.6 4.6 0 0 0 4 9.5c0 4.6 2.7 5.7 5.5 6-.6.6-.6 1.2-.5 2V21"></path></svg>
      <span>Using <strong style="font-weight: 600">stripe-node #2328</strong> · billing thresholds</span>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between; background: #FFFFFF; border-radius: 16px; padding: 8px 10px 8px 12px">
      <label for="qn-suggest" style="display: flex; align-items: center; gap: 8px">
        <span aria-hidden="true" style="width: 18px; height: 18px; border-radius: 5px; background: #635BFF; color: #FFFFFF; font-size: 11px; font-weight: 600; display: grid; place-items: center">S</span>
        <span style="font-weight: 500">Suggest on docs.stripe.com</span>
      </label>
      <input id="qn-suggest" type="checkbox" checked style="width: 38px; height: 20px; accent-color: #1F5FCC">
    </div>
  </div>

  <nav aria-label="Scout" style="margin: 10px 12px 12px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 2px; background: #F2F5FA; border-radius: 999px; padding: 4px">
    <button aria-label="This page" aria-current="page" style="height: 40px; border: none; border-radius: 999px; background: #FFFFFF; color: #1B1F24; display: flex; align-items: center; justify-content: center; gap: 6px; font: 600 12.5px 'Figtree', sans-serif; cursor: pointer; box-shadow: 0 1px 2px rgba(27,31,36,0.08)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"></circle><circle cx="14.5" cy="9.5" r="2" fill="#1F5FCC" stroke="none"></circle></svg>Page</button>
    <button aria-label="Sites" style="height: 40px; border: none; border-radius: 999px; background: transparent; color: #5E6772; display: grid; place-items: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"></path></svg></button>
    <button aria-label="Activity" style="height: 40px; border: none; border-radius: 999px; background: transparent; color: #5E6772; display: grid; place-items: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg></button>
    <button aria-label="Settings" style="height: 40px; border: none; border-radius: 999px; background: transparent; color: #5E6772; display: grid; place-items: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg></button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":400,"height":880}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
