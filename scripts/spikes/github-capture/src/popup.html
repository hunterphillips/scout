<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Scout capture spike</title>
<style>
  body { font: 12px system-ui, sans-serif; margin: 10px; width: 300px; }
  h1 { font-size: 13px; margin: 0 0 8px; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; margin: 0 0 10px; }
  dt { color: #666; }
  dd { margin: 0; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; }
  button { font: inherit; padding: 3px 8px; }
  .note { color: #666; margin-top: 8px; }
</style>
</head>
<body>
<h1>Scout GitHub capture spike</h1>
<dl id="status"></dl>
<div class="row">
  <button id="grant">Grant GitHub</button>
  <button id="pause">Pause</button>
  <button id="reconnect">Reconnect</button>
</div>
<p class="note">Metadata only. Captured text is never shown, stored or logged.</p>
<script type="module" src="popup.mjs"></script>
</body>
</html>
