<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Scout Sensor</title>
<style>
  body { font: 12px system-ui, sans-serif; margin: 10px; width: 280px; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; margin: 0 0 10px; }
  dt { color: #666; }
  dd { margin: 0; overflow-wrap: anywhere; }
  #site { margin: 0 0 10px; }
  #site-origin { font-weight: 600; overflow-wrap: anywhere; }
  #site-verdict { color: #666; margin: 2px 0 6px; }
  label { display: block; margin: 0 0 10px; }
  [hidden] { display: none; }
</style>
</head>
<body>
<section id="site">
  <div id="site-origin"></div>
  <div id="site-verdict"></div>
  <button id="allow" hidden>Allow Scout on this site</button>
  <button id="remove" hidden>Remove this site</button>
</section>
<label><input type="checkbox" id="github-capture" disabled> Capture GitHub issue text</label>
<dl id="status"></dl>
<button id="pause" data-paused="false">Pause</button>
<button id="reconnect">Reconnect</button>
<script type="module" src="popup.js"></script>
</body>
</html>
