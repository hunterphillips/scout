<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scout</title>
<style>
  :root {
    color-scheme: light dark;
    --fg: #1f1f1f; --muted: #5f6368; --bg: #ffffff; --line: #dadce0; --accent: #1a73e8; --error: #b3261e; --soft: #f1f3f4;
  }
  @media (prefers-color-scheme: dark) {
    :root { --fg: #e8eaed; --muted: #9aa0a6; --bg: #202124; --line: #3c4043; --accent: #8ab4f8; --error: #f28b82; --soft: #2d2e31; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body { font: 13px/1.45 system-ui, sans-serif; min-width: 0; overflow-x: hidden; }
  header { padding: 10px 14px 6px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 14px; margin: 0; }
  #header-line { margin: 2px 0 0; color: var(--muted); overflow-wrap: anywhere; }
  #root { padding: 0 14px 16px; }
  nav { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  nav button { border: 1px solid transparent; background: none; color: var(--fg); padding: 4px 8px; border-radius: 12px; }
  nav button[aria-current="page"] { background: var(--soft); border-color: var(--line); font-weight: 600; }
  h2 { font-size: 13px; margin: 12px 0 6px; }
  h3 { font-size: 12px; margin: 12px 0 4px; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
  p { margin: 4px 0; overflow-wrap: anywhere; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { padding: 8px 0; border-bottom: 1px solid var(--line); overflow-wrap: anywhere; }
  button { font: inherit; color: inherit; cursor: pointer; padding: 4px 10px; border-radius: 4px; border: 1px solid var(--line); background: var(--bg); }
  button:disabled { cursor: default; opacity: .55; }
  button.link { border: none; background: none; padding: 0; color: var(--accent); font-weight: 600; text-align: left; text-decoration: underline; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .note, .host, .reason { color: var(--muted); }
  .host { font-size: 12px; }
  .error { color: var(--error); }
  .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 6px 0; }
  .sites li { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: center; }
  .site-host { font-weight: 600; overflow-wrap: anywhere; }
  .sites .site-state { grid-column: 1; color: var(--muted); }
  .sites li > button, .sites li > .note { grid-column: 2; grid-row: 1 / span 2; }
  .offers li, .library li { display: flex; flex-direction: column; gap: 2px; }
  .offer-name { font-weight: 600; }
  .add-site { margin-top: 12px; }
  .add-site input { flex: 1 1 140px; min-width: 0; font: inherit; padding: 4px 6px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); color: var(--fg); }
  .check { margin: 10px 0; }
  .check .note { margin-left: 22px; }
  .sheet { margin: 8px 0; padding: 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--soft); }
  .preview { margin-top: 14px; padding-top: 6px; border-top: 2px solid var(--line); }
  .preview dl, dl.status { display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; margin: 4px 0; }
  dt { color: var(--muted); }
  dd { margin: 0; overflow-wrap: anywhere; min-width: 0; }
  .preview-text { max-height: 50vh; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; background: var(--soft); padding: 8px; border-radius: 4px; font: 12px/1.4 ui-monospace, monospace; margin: 6px 0; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>Scout</h1>
  <p id="header-line" role="status" aria-live="polite">Connecting…</p>
</header>
<div id="root"></div>
<script type="module" src="panel.js"></script>
</body>
</html>
